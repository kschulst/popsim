<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>popsim</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='5' cy='6' r='3' fill='%23e8799b'/><rect x='8' y='8' width='5' height='5' transform='rotate(45 10.5 10.5)' fill='%236fa8e8'/></svg>" />
  </head>
  <body>
    <header>
      <h1>popsim <span class="version" id="version"></span></h1>
      <div class="controls">
        <button id="btn-start" title="Til starten av grenen">⏮</button>
        <button id="btn-back10" title="10 steg tilbake (Shift + ←)">◀◀ 10</button>
        <button id="btn-back" title="Ett steg tilbake (←)">|◀</button>
        <button id="btn-play" class="primary" title="Spill / pause (mellomrom)">▶</button>
        <button id="btn-fwd" title="Ett steg frem (→)">▶|</button>
        <button id="btn-fwd10" title="10 steg frem (Shift + →)">10 ▶▶</button>
        <button id="btn-end" title="Til enden av grenen">⏭</button>
        <label class="speed" title="Ticks per sekund">Fart <input id="speed" type="range" min="0" max="100" value="30" /> <span id="speed-label"></span></label>
        <span id="status" class="status"></span>
      </div>
      <div class="controls scrub-row">
        <input id="scrub" type="range" min="0" max="0" value="0" step="1" title="Dra for å gå til et tidspunkt langs denne grenens historikk" />
        <span id="scrub-label" class="status"></span>
      </div>
      <div class="controls">
        <button id="btn-branch" title="Lag en ny gren fra tidspunktet som vises">Forgrein herfra</button>
        <select id="color-mode" title="Fargekoding"></select>
        <label class="check"><input type="checkbox" id="show-fertility" /> Fruktbarhet</label>
        <label class="check" title="Stiplet rosa: søker partner. Grønn: paret seg. Grå med kryss: avvist (krysset står ved den som sa nei). Blå prikket: far som passer på den gravide."><input type="checkbox" id="show-courtship" checked /> Partnerstreker</label>
        <button id="btn-new" title="Ny kjøring">Ny</button>
        <button id="btn-export">Eksporter</button>
        <button id="btn-import">Importer</button>
        <input id="import-file" type="file" accept=".gz,.json" hidden />
      </div>
    </header>
    <main>
      <section class="world">
        <canvas id="world"></canvas>
        <div id="banner" class="banner" hidden></div>
        <div id="map-legend" class="map-legend" hidden></div>
        <div class="map-zoom">
          <button id="legend-toggle" title="Vis forklaring på streker og symboler">Forklaring</button>
          <span class="zoom-level" id="zoom-level">1×</span>
          <button id="zoom-out" title="Zoom ut">−</button>
          <button id="zoom-in" title="Zoom inn">+</button>
          <button id="zoom-reset" title="Vis hele verden (dobbeltklikk på kartet gjør det samme)">Hele verden</button>
        </div>
      </section>
      <aside>
        <nav class="tabs">
          <button data-tab="inspector" class="on">Aktør</button>
          <button data-tab="rules">Regler</button>
          <button data-tab="leaderboards">Topplister</button>
          <button data-tab="editor" id="tab-editor" hidden>Ny gren</button>
        </nav>
        <div class="tab" id="inspector"></div>
        <div class="tab" id="rules" hidden></div>
        <div class="tab" id="leaderboards" hidden></div>
        <div class="tab" id="editor" hidden></div>
      </aside>
    </main>
    <section class="timeline-wrap">
      <h3>Historikk</h3>
      <div id="timeline"></div>
    </section>
    <section id="vitals" class="vitals"></section>
    <section id="charts" class="charts"></section>
    <footer id="footer"></footer>
    <dialog id="new-dialog">
      <form method="dialog">
        <h3>Ny kjøring</h3>
        <p class="muted">Erstatter all historikk i denne fanen. Eksporter først hvis du vil beholde den.</p>
        <p class="muted">Stammene i starten. Hver seed får verdier rundt stammens verdier (±10 %). Arvelighet er arvestyrken for alle egenskaper. Paringsterskel og mutasjonsrate er like for alle stammer.</p>
        <div id="tribe-table" class="tribe-table"></div>
        <div class="row">
          <button type="button" id="tribe-add">Legg til stamme</button>
          <button type="button" id="tribe-reset">Standardstammer</button>
        </div>
        <div class="row">
          <button value="ok" class="primary">Start</button>
          <button value="cancel">Avbryt</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
